<title id="t">Tablero Kanban con límite de trabajo en curso</title>
<desc id="d">Tablero con cuatro columnas: por hacer, en curso con límite de tres tarjetas, probando con límite de dos tarjetas y hecho. La columna probando alcanzó su límite.</desc>
