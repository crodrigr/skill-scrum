<text x="140.0" y="380.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">4. Planificar</text>
<text x="140.0" y="399.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">la siguiente vuelta</text>
