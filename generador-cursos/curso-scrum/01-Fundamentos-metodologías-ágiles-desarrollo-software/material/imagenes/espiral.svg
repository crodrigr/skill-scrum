<text x="140.0" y="111.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">objetivos y alternativas</text>
<rect x="660" y="62" width="200" height="70" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="760.0" y="92.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">2. Evaluar y reducir</text>
<text x="760.0" y="111.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">los riesgos</text>
<rect x="660" y="350" width="200" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="760.0" y="380.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">3. Desarrollar</text>
<text x="760.0" y="399.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">y verificar</text>
