<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Estimación por tallas</title>
<desc id="d">Las historias se comparan con una referencia y se ubican en tallas: chica, mediana o grande. Las historias grandes se dividen antes de planificar.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="918" height="438" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="460" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Estimación por tallas (comparando con una referencia)</text>
<rect x="30" y="60" width="275" height="330" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="167" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Chica (S)</text>
<text x="167" y="114" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">una pantalla, sin reglas especiales</text>
<rect x="46" y="134" width="243" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="167" y="164" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">H1 · Ver canchas libres</text>
<rect x="46" y="196" width="243" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="167" y="226" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">H3 · Recibir confirmación</text>
<rect x="46" y="258" width="243" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="167" y="288" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">H4 · Filtrar por tipo</text>
<rect x="325" y="60" width="275" height="330" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="462" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Mediana (M)</text>
<text x="462" y="114" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">dos o tres pasos, o una regla</text>
<rect x="341" y="134" width="243" height="48" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="462" y="164" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">★ H2 · Reservar un turno</text>
<text x="462" y="226" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">(referencia)</text>
<rect x="620" y="60" width="275" height="330" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="757" y="92" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Grande (L)</text>
<text x="757" y="114" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">más de tres pasos o varias áreas</text>
<rect x="636" y="134" width="243" height="48" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<text x="757" y="164" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Pagar la seña</text>
<rect x="636" y="196" width="243" height="48" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<text x="757" y="226" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Administrar mis reservas</text>
<rect x="636" y="290" width="243" height="80" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="757" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">Se dividen antes de</text>
<text x="757" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">planificar el sprint</text>
<text x="460" y="425" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b">Se estima comparando con la referencia, no midiendo en horas.</text>
</svg>
