<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Refinamiento: entradas, herramientas y salidas</title>
<desc id="d">El refinamiento recibe como entradas el Product Backlog ordenado, el objetivo del producto, la retroalimentación de la revisión y los cambios del contexto; usa herramientas como dividir, criterio de aceptación y tallas; y produce elementos pequeños, claros, con criterio, con talla y ordenados.</desc>
