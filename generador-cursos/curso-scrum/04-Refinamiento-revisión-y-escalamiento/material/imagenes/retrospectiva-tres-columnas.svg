<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Retrospectiva en tres columnas</title>
<desc id="d">Tablero de retrospectiva con tres columnas: comenzar, detener y continuar, con tarjetas del sprint 1, y dos acciones de mejora con responsable y plazo.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="918" height="468" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="460" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Retrospectiva: comenzar, detener, continuar</text>
<rect x="30" y="56" width="275" height="220" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="167" y="88" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Comenzar</text>
<rect x="44" y="104" width="247" height="50" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="167" y="135" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Máximo tres tareas en curso</text>
<rect x="44" y="166" width="247" height="50" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="167" y="197" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Pruebas antes de empezar</text>
<rect x="325" y="56" width="275" height="220" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="462" y="88" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Detener</text>
<rect x="339" y="104" width="247" height="50" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<text x="462" y="135" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Abrir muchas tareas a la vez</text>
<rect x="620" y="56" width="275" height="220" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="757" y="88" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Continuar</text>
<rect x="634" y="104" width="247" height="50" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="757" y="135" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Reunión diaria corta</text>
<rect x="634" y="166" width="247" height="50" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<text x="757" y="197" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Revisión entre pares</text>
<text x="460" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">De las tarjetas salen acciones concretas, con responsable y plazo</text>
<rect x="30" y="320" width="420" height="110" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="240.0" y="352.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Acción 1</text>
<text x="240.0" y="370.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">Mateo propone en el tablero un máximo</text>
<text x="240.0" y="388.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">de tres tareas en curso</text>
<text x="240.0" y="406.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">Plazo: desde el sprint 2</text>
<rect x="470" y="320" width="420" height="110" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="680.0" y="352.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Acción 2</text>
<text x="680.0" y="370.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">Ana y Carla escriben las pruebas de cada</text>
<text x="680.0" y="388.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">historia antes de empezarla</text>
<text x="680.0" y="406.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">Plazo: desde el próximo refinamiento</text>
</svg>
