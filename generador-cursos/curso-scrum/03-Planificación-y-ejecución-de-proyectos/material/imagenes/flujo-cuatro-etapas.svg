<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Flujo de un sprint en cuatro etapas</title>
<desc id="d">Las cuatro etapas del flujo: Product Backlog con épicas, historias de usuario, Sprint Backlog formado en la planificación y ejecución del sprint con el tablero, que termina en un incremento utilizable.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="918" height="398" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="460" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Las cuatro etapas del flujo de un sprint</text>
<rect x="30" y="70" width="190" height="130" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="125.0" y="111.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Etapa 1</text>
<text x="125.0" y="130.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Product Backlog</text>
<text x="125.0" y="149.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">objetivo del producto</text>
<text x="125.0" y="168.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">y épicas</text>
<path d="M220 135 H248" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M125 202 V240" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="30" y="244" width="190" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="125.0" y="267.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Se obtiene</text>
<text x="125.0" y="285.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">Épicas E1 a E4</text>
<rect x="250" y="70" width="190" height="130" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="345.0" y="111.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Etapa 2</text>
<text x="345.0" y="130.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Historias de usuario</text>
<text x="345.0" y="149.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">con criterio de aceptación</text>
<text x="345.0" y="168.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">y prioridad</text>
<path d="M440 135 H468" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M345 202 V240" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="250" y="244" width="190" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="345.0" y="267.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Se obtiene</text>
<text x="345.0" y="285.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">Historias H1 a H4</text>
<rect x="470" y="70" width="190" height="130" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="565.0" y="111.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Etapa 3</text>
<text x="565.0" y="130.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Sprint Backlog</text>
<text x="565.0" y="149.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">planificación: objetivo,</text>
<text x="565.0" y="168.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">historias y tareas</text>
<path d="M660 135 H688" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M565 202 V240" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="470" y="244" width="190" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="565.0" y="267.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Se obtiene</text>
<text x="565.0" y="285.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">Plan del sprint</text>
<rect x="690" y="70" width="190" height="130" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="785.0" y="111.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Etapa 4</text>
<text x="785.0" y="130.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Ejecución</text>
<text x="785.0" y="149.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">tablero y definición</text>
<text x="785.0" y="168.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">de terminado</text>
<path d="M785 202 V240" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="690" y="244" width="190" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="785.0" y="267.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Se obtiene</text>
<text x="785.0" y="285.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">Incremento</text>
<rect x="30" y="330" width="860" height="44" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="460.0" y="356.9" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Planificación y ejecución del proyecto: del Product Backlog al incremento</text>
</svg>
