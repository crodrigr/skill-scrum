<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="t">Reuniones de un sprint de dos semanas</title>
<desc id="d">Línea de tiempo de un sprint de dos semanas: planificación al inicio, reunión diaria cada día, revisión y retrospectiva al final, con los tiempos máximos de la guía para un sprint de un mes.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect x="1" y="1" width="938" height="398" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="470" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Un sprint de dos semanas y sus cuatro reuniones</text>
<rect x="60" y="80" width="820" height="40" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="470" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Sprint (2 semanas)</text>
<line x1="100" y1="120" x2="100" y2="138" stroke="#d97706" stroke-width="2"/>
<circle cx="100" cy="146" r="6" fill="#d97706"/>
<line x1="176" y1="120" x2="176" y2="138" stroke="#d97706" stroke-width="2"/>
<circle cx="176" cy="146" r="6" fill="#d97706"/>
<line x1="252" y1="120" x2="252" y2="138" stroke="#d97706" stroke-width="2"/>
<circle cx="252" cy="146" r="6" fill="#d97706"/>
<line x1="328" y1="120" x2="328" y2="138" stroke="#d97706" stroke-width="2"/>
<circle cx="328" cy="146" r="6" fill="#d97706"/>
<line x1="404" y1="120" x2="404" y2="138" stroke="#d97706" stroke-width="2"/>
<circle cx="404" cy="146" r="6" fill="#d97706"/>
<line x1="480" y1="120" x2="480" y2="138" stroke="#d97706" stroke-width="2"/>
<circle cx="480" cy="146" r="6" fill="#d97706"/>
<line x1="556" y1="120" x2="556" y2="138" stroke="#d97706" stroke-width="2"/>
<circle cx="556" cy="146" r="6" fill="#d97706"/>
<line x1="632" y1="120" x2="632" y2="138" stroke="#d97706" stroke-width="2"/>
<circle cx="632" cy="146" r="6" fill="#d97706"/>
<line x1="708" y1="120" x2="708" y2="138" stroke="#d97706" stroke-width="2"/>
<circle cx="708" cy="146" r="6" fill="#d97706"/>
<line x1="784" y1="120" x2="784" y2="138" stroke="#d97706" stroke-width="2"/>
<circle cx="784" cy="146" r="6" fill="#d97706"/>
<text x="470" y="176" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">● reunión diaria (una por día)</text>
<rect x="30" y="200" width="206" height="130" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="133.0" y="241.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Planificación del sprint</text>
<text x="133.0" y="260.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Primer día</text>
<text x="133.0" y="279.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Todo el equipo Scrum</text>
<text x="133.0" y="298.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Máx. 8 h*</text>
<rect x="256" y="200" width="206" height="130" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="359.0" y="241.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Reunión diaria</text>
<text x="359.0" y="260.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Cada día</text>
<text x="359.0" y="279.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Developers</text>
<text x="359.0" y="298.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">15 min</text>
<rect x="482" y="200" width="206" height="130" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="585.0" y="241.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Revisión del sprint</text>
<text x="585.0" y="260.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Último día</text>
<text x="585.0" y="279.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Equipo e interesados</text>
<text x="585.0" y="298.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Máx. 4 h*</text>
<rect x="708" y="200" width="206" height="130" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="811.0" y="241.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Retrospectiva</text>
<text x="811.0" y="260.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Tras la revisión</text>
<text x="811.0" y="279.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Equipo Scrum</text>
<text x="811.0" y="298.4" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">Máx. 3 h*</text>
<text x="470" y="370" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">* Máximos de la Guía para un sprint de un mes; en sprints más cortos son proporcionalmente menores.</text>
</svg>
